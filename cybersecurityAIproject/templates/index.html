
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megathread Link Checker</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Megathread Link Checker</h1>
        <p>Check whether a URL appears in our reference database.</p>

        <form action="/check" method="POST">
            <label for="url">Enter a URL</label>
            <input
                type="text"
                id="url"
                name="url"
                placeholder="https://example.com/..."
                value="{{ entered_url or '' }}"
                required
            >
            <button type="submit">Submit</button>
        </form>

        {% if message %}
            <div class="result {{ status }}" role="status">
                {{ message }}
            </div>
        {% endif %}

        {% if matches %}
            <section class="matches">
                <h2>Matching resources</h2>
                {% for item in matches %}
                    <article class="match">
                        <p><strong>Displayed text:</strong>
                            {{ item.link_text }}</p>
                        <p><strong>URL:</strong>
                            {{ item.url }}</p>
                    </article>
                {% endfor %}
            </section>
        {% endif %}
    </main>
</body>
</html>
